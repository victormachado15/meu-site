    <script>
        function deBase64(texto) {
            return Uint8Array.from(atob(texto), caractere => caractere.charCodeAt(0));
        }
        async function derivarChave(senha, salt, usos) {
            const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' },
                material, { name: 'AES-GCM', length: 256 }, false, usos
            );
        }
        async function descriptografar(dados, senha) {
            if (dados.formato !== 'avaliacao-criptografada-v1' || dados.iteracoes !== 600000) {
                throw new Error('Formato de prova protegida não reconhecido.');
            }
            const chave = await derivarChave(senha, deBase64(dados.salt), ['decrypt']);
            const conteudo = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: deBase64(dados.iv) }, chave, deBase64(dados.conteudo)
            );
            return new TextDecoder('utf-8', { fatal: true }).decode(conteudo);
        }
        async function abrirProva(evento) {
            evento.preventDefault();
            const botao = document.getElementById('abrir');
            const mensagem = document.getElementById('mensagem');
            botao.disabled = true;
            mensagem.textContent = 'Verificando senha...';
            try {
                if (!window.isSecureContext || !crypto.subtle) {
                    throw new Error('Abra esta página por HTTPS ou em localhost para usar a criptografia.');
                }
                const dados = JSON.parse(document.getElementById('dados-prova-protegida').textContent);
                const html = await descriptografar(dados, document.getElementById('senha').value);
                document.open();
                document.write(html);
                document.close();
                const identificacao = document.getElementById('alunoNome');
                const painel = identificacao && identificacao.closest('.no-print');
                if (painel) painel.classList.remove('no-print');
            } catch (erro) {
                mensagem.textContent = erro.name === 'OperationError'
                    ? 'Senha incorreta ou arquivo danificado.'
                    : `Não foi possível abrir a prova: ${erro.message}`;
                botao.disabled = false;
            }
        }
        document.getElementById('acesso').addEventListener('submit', abrirProva);
    </script>
